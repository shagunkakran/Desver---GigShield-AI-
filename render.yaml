services:
  - type: web
    name: desver
    runtime: node
    plan: free
    buildCommand: npm install --legacy-peer-deps && npm run build
    startCommand: node server/index.js
    healthCheckPath: /api/health
    envVars:
      - key: NODE_VERSION
        value: 22.14.0
      - key: NODE_ENV
        value: production
      - key: CRON_INTERVAL_MS
        value: 0
      - key: MONGODB_URI
        sync: false
